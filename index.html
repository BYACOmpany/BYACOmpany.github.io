<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Linx · Réveil du serveur</title>
<!--
  Écran d'attente pour le réveil d'un service Render gratuit (26/09/2026).

  POURQUOI CE FICHIER EXISTE
  --------------------------
  CORRECTION DU 27/09/2026 : Render sert bel et bien SA PROPRE page de
  réveil à sa marque (HTML, statut 200, sur toutes les routes) tant que
  le conteneur d'un Free Web Service endormi démarre — confirmé par
  observation directe, contrairement à l'hypothèse retenue le 26/09/2026
  (qui supposait la requête simplement en attente, sans rien afficher).
  Cette page Render se recharge seule mais reste à sa marque à elle, pas
  celle du laboratoire — et un premier essai de détection en mode
  "no-cors" (voir historique git) se laissait tromper par CETTE page : la
  réponse opaque du mode no-cors ne permet pas de la distinguer d'une
  vraie réponse applicative, la redirection partait donc trop tôt, droit
  sur l'écran Render.

  Ce fichier est une page STATIQUE, hébergée ici via GitHub Pages
  (toujours disponible, contrairement à Render en veille) : le personnel
  du laboratoire ouvre CETTE page en premier, elle affiche l'écran de
  marque Linx pendant qu'elle attend elle-même que le service Render
  réponde — en lisant vraiment le corps JSON de /healthz (CORS ouvert
  côté Lab, voir _LINX_LAB/app.py) pour s'assurer que c'est l'application
  qui répond, pas la page d'attente Render — puis redirige automatiquement
  vers l'application réelle une fois confirmé.

  Reprend tel quel le composant de chargement de marque
  (LOGO LINX V5 final/pack/loader/linx-lab-loading-page.html) plutôt que
  d'en redessiner un autre : même identité visuelle que le reste de la
  suite.

  CONFIGURATION
  -------------
  Modifier `CIBLE_PAR_DEFAUT` ci-dessous pour l'établissement servi par
  cette page, ou passer l'URL cible en paramètre : cette-page.html?cible=
  https://linx-lab.onrender.com — utile pour réutiliser LE MÊME fichier
  pour plusieurs établissements/applications sans le dupliquer.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0d12; --ink:#eef1f6; --ink-dim:#c3ccdc;
    --gold:#e7b257; --gold-2:#f1c069;
    --indigo:#8992e6; --indigo-2:#a7b0f6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }

  #linx-loader{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    background:
      radial-gradient(ellipse 900px 600px at 50% 40%, #141b26 0%, transparent 70%),
      radial-gradient(ellipse 1200px 900px at 50% 100%, #0d1219 0%, #05070a 60%);
    transition:opacity .45s ease, visibility .45s ease;
  }
  #linx-loader.is-hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  #linx-loader .mark{ width:84px; height:84px; }
  #linx-loader .ring{ fill:none; stroke-width:6.4; stroke-linecap:round; transform-origin:center; }
  #linx-loader .ring--gold{ stroke:var(--gold); stroke-dasharray:56 32; animation:spinCW 2.6s linear infinite; }
  #linx-loader .ring--indigo{ stroke:var(--indigo); stroke-dasharray:56 32; animation:spinCCW 2.6s linear infinite; }
  #linx-loader .lens{ fill:#c7bdf7; animation:pulseLens 1.8s ease-in-out infinite; }
  #linx-loader .link{ stroke:url(#linx-loader-grad); stroke-width:3.4; stroke-linecap:round; stroke-dasharray:3.4 6.6; animation:flowLink .85s linear infinite; }
  #linx-loader .node{ animation:pulseNode 1.8s ease-in-out infinite; }
  #linx-loader .node--right{ animation-delay:.9s; }

  @keyframes spinCW   { to { transform:rotate(360deg); } }
  @keyframes spinCCW  { to { transform:rotate(-360deg); } }
  @keyframes flowLink { to { stroke-dashoffset:-30; } }
  @keyframes pulseLens{ 0%,100%{ opacity:.18; } 50%{ opacity:.42; } }
  @keyframes pulseNode{ 0%,100%{ r:5; } 50%{ r:7.6; } }

  #linx-loader .status{ text-align:center; }
  #linx-loader .status .name{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px;
    letter-spacing:-0.4px; color:var(--ink);
  }
  #linx-loader .status .msg{
    margin-top:6px; font-size:13px; color:var(--ink-dim); letter-spacing:.2px; font-weight:500;
  }
  #linx-loader .status .msg::after{
    content:''; display:inline-block; width:1ch; text-align:left;
    animation:dots 1.4s steps(4,end) infinite;
  }
  @keyframes dots{ 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';} }

  /* Barre de progression indicative — le VRAI état est binaire (le
     serveur a répondu ou pas), cette barre ne fait qu'occuper l'attente
     sans jamais prétendre connaître un pourcentage réel. */
  #linx-loader .progress{
    width:220px; height:4px; border-radius:4px; overflow:hidden;
    background:rgba(255,255,255,.08); margin-top:4px;
  }
  #linx-loader .progress-bar{
    height:100%; width:8%; border-radius:4px;
    background:linear-gradient(90deg, var(--gold), var(--indigo));
    transition:width 3s ease;
  }

  #linx-loader .retry{
    margin-top:6px; font-size:12.5px; color:var(--ink-dim);
    text-align:center; max-width:320px; display:none;
  }
  #linx-loader .retry a{ color:var(--gold-2); text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    #linx-loader .ring, #linx-loader .lens, #linx-loader .link, #linx-loader .node{ animation:none !important; }
  }
</style>
</head>
<body>

  <div id="linx-loader" role="status" aria-live="polite">
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="linx-loader-grad" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f1c069"/>
          <stop offset="1" stop-color="#96a0f2"/>
        </linearGradient>
        <clipPath id="linx-loader-clip"><circle cx="24" cy="32" r="14"/></clipPath>
      </defs>
      <line class="link" x1="10" y1="32" x2="54" y2="32"/>
      <g clip-path="url(#linx-loader-clip)"><circle class="lens" cx="40" cy="32" r="14"/></g>
      <circle class="ring ring--gold"    cx="24" cy="32" r="14"/>
      <circle class="ring ring--indigo"  cx="40" cy="32" r="14"/>
      <circle class="node node--left"  cx="10" cy="32" r="5" fill="#f1c069"/>
      <circle class="node node--right" cx="54" cy="32" r="5" fill="#96a0f2"/>
    </svg>
    <div class="status">
      <div class="name">Linx</div>
      <div class="msg" id="linx-loader-msg">Réveil du serveur</div>
    </div>
    <div class="progress"><div class="progress-bar" id="linx-loader-bar"></div></div>
    <div class="retry" id="linx-loader-retry">
      Ça prend plus longtemps que prévu.
      <a href="#" id="linx-loader-retry-link">Réessayer</a>
      ou <a href="#" id="linx-loader-retry-direct">continuer directement</a>.
    </div>
  </div>

<script>
(() => {
  // ------------------------------------------------------------------
  // Configuration : un seul fichier réutilisable pour plusieurs cibles.
  // ------------------------------------------------------------------
  const CIBLE_PAR_DEFAUT = "https://linx-lab.onrender.com/";

  const params = new URLSearchParams(location.search);
  const cible = params.get("cible") || CIBLE_PAR_DEFAUT;

  let base;
  try {
    base = new URL(cible);
  } catch (e) {
    base = new URL(CIBLE_PAR_DEFAUT);
  }
  const urlSante = new URL("/healthz", base.origin).toString();

  const msg = document.getElementById("linx-loader-msg");
  const bar = document.getElementById("linx-loader-bar");
  const retry = document.getElementById("linx-loader-retry");
  const retryLink = document.getElementById("linx-loader-retry-link");
  const retryDirect = document.getElementById("linx-loader-retry-direct");

  const ETAPES = [
    [0,  "Réveil du serveur"],
    [8,  "Connexion à la base de données"],
    [25, "Ça peut prendre jusqu'à une minute"],
    [45, "Toujours en cours, merci de patienter"],
  ];
  const PROGRES = [10, 35, 60, 80, 92];

  let annule = false;

  function afficherEtape(secondesEcoulees) {
    for (const [seuil, texte] of ETAPES) {
      if (secondesEcoulees >= seuil) msg.textContent = texte;
    }
    const i = Math.min(Math.floor(secondesEcoulees / 4), PROGRES.length - 1);
    bar.style.width = PROGRES[i] + "%";
  }

  function redirigerVers(url) {
    location.href = url;
  }

  async function verifierUneFois() {
    // TROUVAILLE DU 27/09/2026 — Render sert bien sa PROPRE page de
    // réveil (HTML, statut 200) sur TOUTES les routes tant que le
    // conteneur démarre, /healthz compris. Un fetch en mode "no-cors" ne
    // pouvant jamais lire ni le statut ni le corps de la réponse (réponse
    // opaque par construction), il se résolvait dès CETTE page Render —
    // pas celle de l'application — et redirigeait trop tôt, droit dessus.
    // /healthz répond désormais avec un en-tête CORS ouvert
    // (Access-Control-Allow-Origin, voir _LINX_LAB/app.py) : on peut donc
    // lire le VRAI corps JSON, et ne considérer le serveur prêt que
    // lorsque c'est bien LUI qui répond — jamais la page d'attente Render.
    try {
      const rep = await fetch(urlSante, { cache: "no-store" });
      const donnees = await rep.json();
      return typeof donnees === "object" && donnees !== null && "status" in donnees;
    } catch (e) {
      // Réponse non-JSON (page HTML de Render) ou requête refusée :
      // le serveur applicatif ne répond pas encore.
      return false;
    }
  }

  async function attendreReveil() {
    const debut = Date.now();
    const LIMITE_SECONDES = 90;

    while (!annule) {
      const secondes = (Date.now() - debut) / 1000;
      afficherEtape(secondes);

      if (secondes > LIMITE_SECONDES) {
        retry.style.display = "block";
        msg.textContent = "Le serveur met plus de temps que d'habitude";
        return;
      }

      if (await verifierUneFois()) {
        bar.style.width = "100%";
        msg.textContent = "Serveur prêt — redirection";
        setTimeout(() => redirigerVers(cible), 400);
        return;
      }

      await new Promise(r => setTimeout(r, 2500));
    }
  }

  retryLink.addEventListener("click", (e) => {
    e.preventDefault();
    retry.style.display = "none";
    annule = false;
    attendreReveil();
  });
  retryDirect.addEventListener("click", (e) => {
    e.preventDefault();
    redirigerVers(cible);
  });

  attendreReveil();
})();
</script>
</body>
</html>
